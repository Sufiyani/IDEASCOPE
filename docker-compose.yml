services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # remove the profiles lines once backend/app/main.py and the frontend pages exist
  api:
    profiles: ["app"]
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/code/app
      - uploads_data:/data/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # remove the profiles lines once backend/app/main.py and the frontend pages exist
  worker:
    profiles: ["app"]
    build: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/data/uploads
    command: python -m app.worker.runner

  # remove the profiles lines once backend/app/main.py and the frontend pages exist
  frontend:
    profiles: ["app"]
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - api
    volumes:
      - ./frontend/src:/app/src
      - /app/node_modules
    command: ["npm", "run", "dev"]

volumes:
  postgres_data:
  uploads_data:
